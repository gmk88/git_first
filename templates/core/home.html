{% extends 'core/base.html' %}

{% block title %}首页 - 技术咨询服务{% endblock %}

{% block content %}
<div class="hero">
    <h1>专业技术咨询服务</h1>
    <p>为企业提供高质量的技术咨询与书面报告交付</p>
    <a href="/request/" class="btn btn-primary">提交咨询申请</a>
</div>

{% for block in blocks %}
<section class="content-block" id="{{ block.key }}">
    <h2>{{ block.title }}</h2>
    <div class="block-body">{{ block.body|linebreaks }}</div>
</section>
{% endfor %}
{% endblock %}
